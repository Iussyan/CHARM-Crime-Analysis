<!DOCTYPE html>
<html>
    <head>
        <title>Manage Users</title>
        <link rel="stylesheet" href="css/users.css">        
        <link rel="stylesheet" href="css/universal.css">
        <style>
            /* Add styles for the collapsible panel */
            .grid-container {
                display: grid;
                grid-template-columns: 250px auto;
                transition: all 0.3s ease;
            }

            .grid-container.collapsed {
                grid-template-columns: 80px auto;
            }

            .dashboard {
                transition: all 0.3s ease;
                overflow: hidden;
            }

            .dashboard.collapsed .choices span {
                display: none;
            }

            .dashboard.collapsed .choices img {
                margin: 0 auto;
                display: block;
            }

            .dashboard.collapsed .headerss .fontts {
                display: none;
            }

            .dashboard.collapsed .iconss p {
                display: none;
            }

            .dashboard.collapsed .iconss img {
                margin-top: 20px; /* Add space to move it down */
                transition: all 0.3s ease; /* Smooth transition */
                transform: translateY(20px); /* Move the image down by 20px */
                transition: transform 0.3s ease; /* Smooth transition */
            }

            .board {
                transition: all 0.3s ease;
            }

            /* Default position of the toggle button */
            .toggle-button {
                position: fixed;
                top: 15px;
                left: 11%; /* Starting position when expanded */
                cursor: pointer;
                background-color: #ccc;
                border: none;
                padding: 7px 10px;
                border-radius: 5px;
                z-index: 1000;
                transition: all 0.3s ease;
            }

            /* Adjust position when grid-container is collapsed */
            .grid-container.collapsed .toggle-button {
                left: 1.2%; /* End position when collapsed */
            }
        </style>
    </head>
    <body>
        <div class="grid-container" id="gridContainer">
            <button class="toggle-button" onclick="togglePanel()">☰</button>
            <div class="dashboard" id="dashboard">
                <div class="headerss">
                    <p class="fontts">Crime reporting</p>
                </div>
                <div class="iconss">
                    <img src="image/flower.jpg" class="user-icon">
                    <p>USER</p>
                </div>
                
                <div class="choices">
                    <ul>
                        <li><a href="dashboard.html"><img src="image/icons8-dashboard-24.png" alt=""> &nbsp; <span>Dashboard</span></a></li>
                        <li><a href="encode.html"><img src="image/icons8-document-64.png" alt=""> &nbsp;<span>Crime Data</span></a></li>
                        <li><a href="mapping.html"><img src="image/icons8-place-marker-24.png" alt=""> &nbsp;<span>Crime Mapping</span></a></li>
                        <li><a href="analysis.html"><img src="image/icons8-graph-50.png" alt=""> &nbsp;<span>Crime Analysis</span></a></li>
                        <li><a href="users.html"><img src="image/icons8-user-48.png" alt=""> &nbsp;<span>Manage Users</span></a></li>
                        <li><img src="image/icons8-logout-50.png" alt=""> &nbsp; <span>Logout</span></li>
                    </ul>
                </div>
            </div>
        
            <div class="board">
                <div class="dashboardss">
                    <p>User Management</p>
                </div>  
                <div class="table-grid">
                    <div class="encode-btn">
                        <div class="encode-crud"><button class="btn-crud">ADD</button></div>
                    </div>
                    <div class="encode-table">
                        <h1>Crime Report Table</h1>
                        <table class="crime-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Birthdate</th>
                                    <th>Age</th>
                                    <th>Sex</th>
                                    <th>Email</th>
                                    <th>Username</th>
                                    <th>Password</th>
                                </tr>
                            </thead>
                           
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="detailsModal" class="user-modal">
            <div class="user-modal-content">
                <span class="user-modal-close" onclick="closeModal('detailsModal')">&times;</span>
                <h2>Details</h2>
                <div class="user-details-content">
                    <p><strong>ID:</strong> <span id="detail-id"></span></p>
                    <p><strong>Name:</strong> <span id="detail-name"></span></p>
                    <p><strong>Birthdate:</strong> <span id="detail-birthdate"></span></p>
                    <p><strong>Age:</strong> <span id="detail-age"></span></p>
                    <p><strong>Sex:</strong> <span id="detail-sex"></span></p>
                    <p><strong>Email:</strong> <span id="detail-email"></span></p>
                    <p><strong>Username:</strong> <span id="detail-username"></span></p>
                </div>
                <div class="user-modal-buttons">
                    <button class="btn-update">Update</button>
                    <button class="btn-archive">Archive</button>
                </div>
            </div>
        </div>
        <script>
            function togglePanel() {
                const gridContainer = document.getElementById('gridContainer');
                const dashboard = document.getElementById('dashboard');
                const userIcon = document.querySelector('.user-icon');
                
                gridContainer.classList.toggle('collapsed');
                dashboard.classList.toggle('collapsed');
                
                if (gridContainer.classList.contains('collapsed')) {
                    // Save the collapsed state
                    localStorage.setItem('menuState', 'collapsed');
                    userIcon.style.width = '40px';
                    userIcon.style.height = '40px';
                } else {
                    // Save the expanded state
                    localStorage.setItem('menuState', 'expanded');
                    userIcon.style.width = '';
                    userIcon.style.height = '';
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                const gridContainer = document.getElementById('gridContainer');
                const dashboard = document.getElementById('dashboard');
                const userIcon = document.querySelector('.user-icon');
                
                // Get the saved menu state from localStorage
                const menuState = localStorage.getItem('menuState');
                
                if (menuState === 'collapsed') {
                    gridContainer.classList.add('collapsed');
                    dashboard.classList.add('collapsed');
                    if (userIcon) {
                        userIcon.style.width = '40px';
                        userIcon.style.height = '40px';
                    }
                } else {
                    gridContainer.classList.remove('collapsed');
                    dashboard.classList.remove('collapsed');
                    if (userIcon) {
                        userIcon.style.width = '';
                        userIcon.style.height = '';
                    }
                }
            });
        </script>
        <script src="script.js"></script>
    </body>
</html>
